[project]
name = "retail-intelligence"
version = "0.1.0"
description = "Demand forecasting service and AI support agent over a shared retail database"
readme = "README.md"
authors = [
    { name = "Ganesan Renganathan", email = "rganesan.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "faker>=40.38.0",
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false
